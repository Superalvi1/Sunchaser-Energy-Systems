name: Validate Catalog Product Selection Fix

on:
  push:
    branches:
      - fix/catalog-product-selection-crash
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Check changed files against TypeScript
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E 'src/(lib/useOverlayBackClose|components/quoteAuthoring/CatalogProductPicker)\.tsx?\(' /tmp/tsc.log; then
            echo 'TypeScript error found in catalog selection hotfix files.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Repository has unrelated baseline TypeScript errors; hotfix files are clean.'
          fi

      - name: Assert browser picker does not mutate history
        shell: bash
        run: |
          ! grep -F 'window.history.pushState' src/lib/useOverlayBackClose.ts
          ! grep -F 'window.history.back' src/lib/useOverlayBackClose.ts
          ! grep -F 'addEventListener("popstate"' src/lib/useOverlayBackClose.ts
          ! grep -F "addEventListener('popstate'" src/lib/useOverlayBackClose.ts

      - name: Test mobile overlay behavior
        run: npm run test:ai-quote-mobile

      - name: Test website catalog
        run: npm run test:website-catalog

      - name: Build production frontend
        run: npx vite build --mode production

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set APK version 1.0.13 build 16
        shell: bash
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 16/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.0.13"/' android/app/build.gradle
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.13-build16-catalog-selection-fix
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
