name: Verify public catalogue RPC cache

on:
  pull_request:
    paths:
      - "server/marketplace/catalogue/**"
      - ".github/workflows/verify-catalogue-egress.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsx server/marketplace/catalogue/cachedPublicCatalogueRepository.test.ts
      - run: npx tsx server/marketplace/catalogue/catalogueRoutes.test.ts
