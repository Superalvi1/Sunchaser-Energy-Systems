name: Build Play Store AAB

on:
  push:
    branches:
      - release/android-1.0.14-build17
    paths:
      - .github/workflows/build-playstore-aab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/android-1.0.14-build17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build CRM frontend
        run: npx vite build --mode production

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Use runner Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_SDK_ROOT"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Test PDF authorization and customer ownership
        run: |
          npx tsx server/middleware/stagedPdfRoutePolicy.test.ts
          npx tsx src/lib/quotePdfExport.test.ts
          npx tsx src/lib/quickQuotationMode.test.ts
          npx tsx server/middleware/authorization.test.ts
          npx tsx server/ownership/ownership.test.ts

      - name: Build signed Play Store AAB and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Verify AAB and version
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'versionCode 17' android/app/build.gradle
          grep -q 'versionName "1.0.14"' android/app/build.gradle
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.14-build17-api36-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Verify release signatures
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          aapt dump badging android/app/build/outputs/apk/release/app-release.apk | head -n 8

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.14-build17-api36-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
