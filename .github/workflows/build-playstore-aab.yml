name: Build Play Store AAB

on:
  push:
    branches:
      - fix/android-pdf-no-native-handoff

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build CRM frontend
        run: npx vite build --mode production

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed Play Store AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify AAB and version
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          grep -q 'versionCode 15' android/app/build.gradle
          grep -q 'versionName "1.0.12"' android/app/build.gradle

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.12-build15-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
