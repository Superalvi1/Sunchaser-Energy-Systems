name: WA CRM Read-only Adapter Contract

on:
  pull_request:
    paths:
      - "server/integrations/wacrm/**"
      - ".github/workflows/wacrm-readonly-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Verify isolated adapter without credentials or network
        run: node --experimental-strip-types server/integrations/wacrm/wacrmReadOnlyClient.test.ts
