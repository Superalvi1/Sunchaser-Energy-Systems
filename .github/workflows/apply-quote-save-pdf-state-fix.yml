name: Apply quote save and PDF state hotfix

on:
  push:
    branches:
      - fix/quote-save-pdf-state
    paths:
      - .github/workflows/apply-quote-save-pdf-state-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/quote-save-pdf-state
          fetch-depth: 0

      - name: Apply focused source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(src: str, old: str, new: str, label: str) -> str:
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return src.replace(old, new, 1)

          def replace_in_block(src: str, start: str, end: str, old: str, new: str, label: str) -> str:
              start_idx = src.find(start)
              if start_idx < 0:
                  raise SystemExit(f'{label}: start marker missing')
              end_idx = src.find(end, start_idx + len(start))
              if end_idx < 0:
                  raise SystemExit(f'{label}: end marker missing')
              block = src[start_idx:end_idx]
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match inside block, found {count}')
              block = block.replace(old, new, 1)
              return src[:start_idx] + block + src[end_idx:]

          sales_path = Path('src/components/SalesTeamApp.tsx')
          sales = sales_path.read_text()

          sales = replace_once(
              sales,
              '  const [savingQuote, setSavingQuote] = useState<boolean>(false);\n',
              '  const [savingQuote, setSavingQuote] = useState<boolean>(false);\n  const savingQuoteRef = useRef<boolean>(false);\n',
              'saving quote ref state',
          )

          sizer_start = '  const handleSaveSizerQuote = async () => {'
          sizer_end = '  // Compile Quote Payload & Send to API (Manual BOQ — explicit save only)'
          sales = replace_in_block(
              sales, sizer_start, sizer_end,
              '    if (!activeLead || savingQuote) return;\n',
              '    if (!activeLead || savingQuoteRef.current) return;\n',
              'sizer duplicate-save guard',
          )
          sales = replace_in_block(
              sales, sizer_start, sizer_end,
              '    setSubmitError(null);\n    setSavingQuote(true);\n',
              '    setSubmitError(null);\n    savingQuoteRef.current = true;\n    setSavingQuote(true);\n',
              'sizer saving lock',
          )
          sales = replace_in_block(
              sales, sizer_start, sizer_end,
              '      if (onRefreshState) await onRefreshState();\n',
              '      if (onRefreshState) {\n        void Promise.resolve()\n          .then(() => onRefreshState())\n          .catch((refreshErr) => console.error("Quote refresh failed:", refreshErr));\n      }\n',
              'sizer background refresh',
          )
          sales = replace_in_block(
              sales, sizer_start, sizer_end,
              '    } finally {\n      setSavingQuote(false);\n    }\n',
              '    } finally {\n      savingQuoteRef.current = false;\n      setSavingQuote(false);\n    }\n',
              'sizer saving cleanup',
          )

          manual_start = '  const handleSaveQuote = async (e?: React.FormEvent): Promise<string | null> => {'
          manual_end = '  const resolveTargetManualQuote = () => {'
          sales = replace_in_block(
              sales, manual_start, manual_end,
              '    if (savingQuote) return null;\n',
              '    if (savingQuoteRef.current) return null;\n',
              'manual duplicate-save guard',
          )
          sales = replace_in_block(
              sales, manual_start, manual_end,
              '    setSavingQuote(true);\n\n    try {\n',
              '    savingQuoteRef.current = true;\n    setSavingQuote(true);\n\n    try {\n',
              'manual saving lock',
          )
          sales = replace_in_block(
              sales, manual_start, manual_end,
              '      if (onRefreshState) await onRefreshState();\n',
              '      if (onRefreshState) {\n        void Promise.resolve()\n          .then(() => onRefreshState())\n          .catch((refreshErr) => console.error("Quote refresh failed:", refreshErr));\n      }\n',
              'manual background refresh',
          )
          sales = replace_in_block(
              sales, manual_start, manual_end,
              '    } finally {\n      setSavingQuote(false);\n    }\n',
              '    } finally {\n      savingQuoteRef.current = false;\n      setSavingQuote(false);\n    }\n',
              'manual saving cleanup',
          )

          resolver_old = '''  const resolveTargetManualQuote = () => {\n    if (!activeLead) return null;\n    return editingQuoteId\n      ? activeLead.quotes?.find((q: any) => q.id === editingQuoteId && q.quote_type === "manual_boq")\n      : getLatestSavedQuote(activeLead, "manual_boq");\n  };\n'''
          resolver_new = '''  const resolveTargetManualQuote = () => {\n    if (!activeLead) return null;\n    if (editingQuoteId) {\n      const refreshedQuote = activeLead.quotes?.find(\n        (q: any) => q.id === editingQuoteId && q.quote_type === "manual_boq"\n      );\n      // Save returns the durable quote id before the parent lead refresh necessarily finishes.\n      return refreshedQuote || { id: editingQuoteId, quote_type: "manual_boq" };\n    }\n    return getLatestSavedQuote(activeLead, "manual_boq");\n  };\n'''
          sales = replace_once(sales, resolver_old, resolver_new, 'manual saved-id fallback')

          sales = sales.replace('alert("Save a quote first.");', 'alert("Please save the customer quotation before generating the PDF.");', 1)

          print_old = '''  const handlePrintManualQuotePDF = async (quoteId?: string) => {\n    if (!activeLead) return;\n\n    const targetManualQuote = quoteId\n      ? activeLead.quotes?.find((q: any) => q.id === quoteId && q.quote_type === "manual_boq")\n      : resolveTargetManualQuote();\n    if (!targetManualQuote) {\n      alert("Save a quote first.");\n      return;\n    }\n    try {\n      await openManualQuotePrintPreview(activeLead.id, targetManualQuote.id);\n    } catch (err: any) {\n      alert(err?.message || "Print preview failed.");\n    }\n  };\n'''
          print_new = '''  const handlePrintManualQuotePDF = async (quoteId?: string) => {\n    if (!activeLead) return;\n\n    try {\n      let resolvedQuoteId = quoteId;\n\n      if (!quoteId && activeModule === "boq_builder") {\n        const manualItemCount = boqRows.filter((r) => r && r.type === "item").length;\n        if (manualItemCount > 0 || !resolveTargetManualQuote()) {\n          const savedId = await handleSaveQuote();\n          if (!savedId) return;\n          resolvedQuoteId = savedId;\n        }\n      }\n\n      if (!resolvedQuoteId) {\n        const targetManualQuote = resolveTargetManualQuote();\n        if (!targetManualQuote) {\n          alert("Please save the customer quotation before generating the PDF.");\n          return;\n        }\n        resolvedQuoteId = targetManualQuote.id;\n      }\n\n      await openManualQuotePrintPreview(activeLead.id, resolvedQuoteId);\n    } catch (err: any) {\n      alert(err?.message || "Print preview failed.");\n    }\n  };\n'''
          sales = replace_once(sales, print_old, print_new, 'manual print auto-save flow')
          sales_path.write_text(sales)

          export_path = Path('src/lib/quotePdfExport.ts')
          export_src = export_path.read_text()
          friendly_old = '''function friendlyPdfError(status: number, text: string): string {\n  const trimmed = (text || "").trim();\n  if (trimmed.includes("PDF engine is not installed")) return PDF_ENGINE_MISSING_MESSAGE;\n  if (/executable doesn't exist|playwright install/i.test(trimmed)) return PDF_ENGINE_MISSING_MESSAGE;\n  return trimmed || `PDF download failed (${status})`;\n}\n'''
          friendly_new = '''function friendlyPdfError(status: number, text: string): string {\n  const trimmed = (text || "").trim();\n  if (trimmed.includes("PDF engine is not installed")) return PDF_ENGINE_MISSING_MESSAGE;\n  if (/executable doesn't exist|playwright install/i.test(trimmed)) return PDF_ENGINE_MISSING_MESSAGE;\n\n  let message = trimmed;\n  if (trimmed.startsWith("{")) {\n    try {\n      const parsed = JSON.parse(trimmed) as { error?: unknown; message?: unknown };\n      if (typeof parsed.error === "string") message = parsed.error;\n      else if (typeof parsed.message === "string") message = parsed.message;\n    } catch {\n      // Preserve plain-text server responses.\n    }\n  }\n\n  if (/save a quote first/i.test(message)) {\n    return "Please save the customer quotation before generating the PDF.";\n  }\n  return message || `PDF download failed (${status})`;\n}\n'''
          export_src = replace_once(export_src, friendly_old, friendly_new, 'friendly PDF errors')
          export_path.write_text(export_src)

          server_path = Path('server.ts')
          server = server_path.read_text()
          stage_old = '''app.post("/api/export/pdf/stage-saved-quote", async (req, res) => {\n  const staff = resolveStaffActor(req, res);\n  if (!staff) return;\n  try {\n    const leadId = String(req.body?.leadId || "");\n    const quoteId = req.body?.quoteId ? String(req.body.quoteId) : "";\n    if (!leadId) return res.status(400).json({ error: "leadId is required" });\n    if (!(await guardSalesOwnedResource(req, res, "manual_quote_export", leadId))) return;\n    loadDb();\n    let activeState: Database = db;\n    if (isSupabaseActive()) activeState = await fetchAppStateFromSupabase();\n    const lead = activeState.leads.find((item: any) => String(item.id) === leadId);\n    if (!lead) return res.status(404).json({ error: "Lead not found" });\n    const quotes = (activeState.quotes || []).filter((q: any) => String(q.lead_id) === leadId);\n    const quote = quoteId ? quotes.find((q: any) => String(q.id) === quoteId) : quotes[quotes.length - 1];\n    if (!quote) return res.status(404).json({ error: "Save a quote first." });\n    const rendered = compileManualQuoteExportHtml(activeState, quote, lead, { hideActionBar: true });\n    if (rendered.exportBlocked) return res.status(409).json({ error: rendered.exportBlockReason || "Quotation cannot be exported." });\n    const filename = buildQuotationPdfFilename(lead, quote);\n    const pdfBuffer = await renderQuotationHtmlToPdf(rendered.html);\n    const token = stageQuotationPdf(pdfBuffer, filename);\n    return res.json({ downloadUrl: `/api/export/pdf/staged-public/${token}`, filename, expiresInSeconds: 120 });\n  } catch (err: any) {\n    console.error("[PDF STAGE SAVED QUOTE]", err);\n    return res.status(500).json({ error: formatQuotationPdfError(err) });\n  }\n});\n'''
          stage_new = '''app.post("/api/export/pdf/stage-saved-quote", async (req, res) => {\n  const staff = resolveStaffActor(req, res);\n  if (!staff) return;\n  try {\n    const leadId = String(req.body?.leadId || "");\n    const quoteId = req.body?.quoteId ? String(req.body.quoteId) : "";\n    if (!leadId) return res.status(400).json({ error: "leadId is required" });\n    if (!(await guardSalesOwnedResource(req, res, "manual_quote_export", leadId))) return;\n\n    // Use the same canonical resolver as browser preview/download. Quotes are stored\n    // on the hydrated lead (and in Supabase quotations), not activeState.quotes.\n    const resolved = await resolveSavedManualQuoteForExport(leadId, quoteId || undefined);\n    if ("error" in resolved && resolved.error) {\n      return res.status(resolved.error.status).json({ error: resolved.error.message });\n    }\n    const { activeState, lead, quote, options } = resolved;\n    const rendered = compileManualQuoteExportHtml(activeState, quote, lead, { ...options, hideActionBar: true });\n    if (rendered.exportBlocked) return res.status(409).json({ error: rendered.exportBlockReason || "Quotation cannot be exported." });\n    const filename = buildQuotationPdfFilename(lead, quote);\n    const pdfBuffer = await renderQuotationHtmlToPdf(rendered.html);\n    const token = stageQuotationPdf(pdfBuffer, filename);\n    return res.json({ downloadUrl: `/api/export/pdf/staged-public/${token}`, filename, expiresInSeconds: 120 });\n  } catch (err: any) {\n    console.error("[PDF STAGE SAVED QUOTE]", err);\n    return res.status(500).json({ error: formatQuotationPdfError(err) });\n  }\n});\n'''
          server = replace_once(server, stage_old, stage_new, 'Android staged saved-quote resolver')
          server_path.write_text(server)

          test_path = Path('src/lib/quotePdfExport.test.ts')
          tests = test_path.read_text()

          manual_urls = '''check("manual PDF URLs remain on the manual-quote routes", () => {\n  assert.match(manualQuotePdfPreviewUrl("lead-1", "q-m"), /\\/api\\/export\\/pdf\\/manual-quote\\/lead-1/);\n  assert.match(manualQuotePdfDownloadUrl("lead-1", "q-m"), /\\/api\\/export\\/pdf\\/manual-quote\\/lead-1\\/download/);\n  assert.doesNotMatch(manualQuotePdfDownloadUrl("lead-1", "q-m"), /auto-sizer/);\n});\n'''
          tests = replace_once(
              tests,
              manual_urls,
              manual_urls + '''\ncheck("PDF API JSON errors become a customer-friendly message", () => {\n  const friendly = sliceBetween(\n    exportSrc,\n    "function friendlyPdfError",\n    "export function manualQuotePdfPreviewUrl"\n  );\n  assert.match(friendly, /JSON\\.parse\\(trimmed\\)/);\n  assert.match(friendly, /Please save the customer quotation before generating the PDF\\./);\n});\n''',
              'friendly PDF error regression test',
          )

          generated_marker = 'check("Generated Quotes routes AutoSizer versions to AutoSizer helpers", () => {\n'
          state_tests = '''check("customer quote save releases UI state before background lead refresh completes", () => {\n  const saveFn = sliceBetween(\n    salesSrc,\n    "const handleSaveQuote = async",\n    "const resolveTargetManualQuote"\n  );\n  assert.match(saveFn, /setEditingQuoteId\\(savedQuoteId\\)/);\n  assert.match(saveFn, /Promise\\.resolve\\(\\)\\s*\\.then\\(\\(\\) => onRefreshState\\(\\)\\)/);\n  assert.doesNotMatch(saveFn, /await onRefreshState\\(\\)/);\n  assert.match(saveFn, /savingQuoteRef\\.current = false/);\n});\n\ncheck("newly returned manual quote id remains immediately printable", () => {\n  const resolver = sliceBetween(\n    salesSrc,\n    "const resolveTargetManualQuote",\n    "const handleDownloadManualQuotePDF"\n  );\n  assert.match(resolver, /refreshedQuote \\|\\| \\{ id: editingQuoteId, quote_type: "manual_boq" \\}/);\n});\n\ncheck("manual download and print use the quote id returned by save", () => {\n  const downloadFn = sliceBetween(\n    salesSrc,\n    "const handleDownloadManualQuotePDF",\n    "const handlePrintManualQuotePDF"\n  );\n  const printFn = sliceBetween(\n    salesSrc,\n    "const handlePrintManualQuotePDF",\n    "const handleDownloadAutoSizerQuotePDF"\n  );\n  assert.match(downloadFn, /const savedId = await handleSaveQuote\\(\\)/);\n  assert.match(downloadFn, /resolvedQuoteId = savedId/);\n  assert.match(printFn, /const savedId = await handleSaveQuote\\(\\)/);\n  assert.match(printFn, /resolvedQuoteId = savedId/);\n});\n\n'''
          if generated_marker not in tests:
              raise SystemExit('missing Generated Quotes test marker')
          tests = tests.replace(generated_marker, state_tests + generated_marker, 1)

          server_marker = 'check("server AutoSizer PDF routes remain staff-protected", () => {\n'
          stage_test = '''check("staged mobile PDF export uses the canonical saved manual quote resolver", () => {\n  const staged = sliceBetween(\n    serverSrc,\n    'app.post("/api/export/pdf/stage-saved-quote"',\n    'app.get("/api/export/pdf/staged-public/:token"'\n  );\n  assert.match(staged, /resolveSavedManualQuoteForExport\\(leadId, quoteId \\|\\| undefined\\)/);\n  assert.doesNotMatch(staged, /activeState\\.quotes/);\n  assert.match(staged, /compileManualQuoteExportHtml/);\n});\n\n'''
          if server_marker not in tests:
              raise SystemExit('missing server route test marker')
          tests = tests.replace(server_marker, stage_test + server_marker, 1)
          test_path.write_text(tests)
          PY

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Run quotation regression tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          npm run test:quote-pdf-export
          npm run test:quote-customer-boq
          npm run test:quote-commercial
          npx tsc --noEmit

      - name: Build production frontend
        run: npx vite build --mode production

      - name: Commit verified fix and remove patcher
        shell: bash
        run: |
          git diff --check
          git config user.name 'Sunchaser CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-quote-save-pdf-state-fix.yml
          git add server.ts src/components/SalesTeamApp.tsx src/lib/quotePdfExport.ts src/lib/quotePdfExport.test.ts
          git commit -m 'fix: stabilize quote save and PDF actions'
          git push origin HEAD:fix/quote-save-pdf-state
