name: Railway production cutover smoke

on:
  pull_request:
    paths:
      - "scripts/railway-cutover-smoke.mjs"
      - ".github/workflows/railway-cutover-smoke.yml"
  workflow_dispatch:

jobs:
  cutover-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/railway-cutover-smoke.mjs
