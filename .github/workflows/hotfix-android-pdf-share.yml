name: Hotfix Android PDF Share

on:
  push:
    branches:
      - fix/android-pdf-share-crash

permissions:
  contents: write

jobs:
  hotfix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/android-pdf-share-crash

      - name: Apply native PDF share hotfix
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/lib/quotePdfExport.ts')
          s = p.read_text()

          old_base64 = '''async function blobToBase64(blob: Blob): Promise<string> {
            const bytes = new Uint8Array(await blob.arrayBuffer());
            let binary = "";
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
              binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
          }'''.replace('          ', '')

          new_base64 = '''async function blobToBase64(blob: Blob): Promise<string> {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onerror = () => reject(reader.error || new Error("Unable to read generated PDF."));
              reader.onload = () => {
                const result = reader.result;
                if (typeof result !== "string") {
                  reject(new Error("Unable to encode generated PDF."));
                  return;
                }
                const comma = result.indexOf(",");
                resolve(comma >= 0 ? result.slice(comma + 1) : result);
              };
              reader.readAsDataURL(blob);
            });
          }'''.replace('          ', '')

          old_native = '''  if (Capacitor.isNativePlatform()) {
            const data = await blobToBase64(blob);

            // Keep a persistent copy in Documents when Android allows it. Sharing is
            // deliberately done from Cache because Capacitor Share exposes cache files
            // by default; other folders require custom Android FileProvider paths.
            try {
              await Filesystem.writeFile({
                path: `Sunchaser/${filename}`,
                data,
                directory: Directory.Documents,
                recursive: true,
              });
            } catch {
              // Some Android versions/storage policies may deny Documents access.
              // The cache copy below still enables Save/Share through the system sheet.
            }

            const shareable = await Filesystem.writeFile({
              path: filename,
              data,
              directory: Directory.Cache,
              recursive: true,
            });

            await Share.share({
              title: filename,
              text: "Sunchaser quotation PDF",
              files: [shareable.uri],
              dialogTitle: "Save or share quotation PDF",
            });
            return;
          }'''.replace('          ', '')

          new_native = '''  if (Capacitor.isNativePlatform()) {
            if (!blob.size) throw new Error("The generated PDF is empty.");

            // Keep one native copy only. Creating a Documents copy and then another
            // Cache copy doubles the bridge/base64 memory pressure on Android.
            const data = await blobToBase64(blob);
            const shareable = await Filesystem.writeFile({
              path: `sunchaser-${Date.now()}-${filename}`,
              data,
              directory: Directory.Cache,
              recursive: true,
            });

            const canShare = await Share.canShare().catch(() => ({ value: false }));
            if (!canShare.value) {
              throw new Error("PDF generated successfully, but Android sharing is unavailable on this device.");
            }

            try {
              // Capacitor recommends `url` for one local file. `files` is intended for
              // multi-file sharing and caused unstable native handoff on some devices.
              await Share.share({
                title: filename,
                url: shareable.uri,
                dialogTitle: "Save or share quotation PDF",
              });
            } catch (error) {
              console.error("Android PDF share failed", error);
              throw new Error("PDF generated successfully, but Android could not open the Save/Share sheet. Please try again.");
            }
            return;
          }'''.replace('          ', '')

          if old_base64 in s:
              s = s.replace(old_base64, new_base64, 1)
          elif 'reader.readAsDataURL(blob)' not in s:
              raise SystemExit('Expected blobToBase64 source not found')

          if old_native in s:
              s = s.replace(old_native, new_native, 1)
          elif 'Capacitor recommends `url` for one local file' not in s:
              raise SystemExit('Expected native share source not found')

          p.write_text(s)

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text().replace('versionCode 11', 'versionCode 12').replace('versionName "1.0.8"', 'versionName "1.0.9"')
          gradle.write_text(g)

      - name: Commit hotfix source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Hotfix already applied"
          else
            git config user.name "Sunchaser CI"
            git config user.email "actions@users.noreply.github.com"
            git add src/lib/quotePdfExport.ts android/app/build.gradle
            git commit -m "fix: prevent Android PDF share crash"
            git push origin HEAD:fix/android-pdf-share-crash
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Build CRM frontend
        run: npx vite build --mode production

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify version and APK
        shell: bash
        run: |
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.9-build12-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
