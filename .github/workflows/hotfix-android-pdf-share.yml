name: Hotfix Android PDF Share

on:
  push:
    branches:
      - fix/android-pdf-share-crash

permissions:
  contents: write

jobs:
  hotfix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/android-pdf-share-crash

      - name: Apply native PDF share hotfix
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/lib/quotePdfExport.ts')
          s = p.read_text()

          new_base64 = '''async function blobToBase64(blob: Blob): Promise<string> {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onerror = () => reject(reader.error || new Error("Unable to read generated PDF."));
              reader.onload = () => {
                const result = reader.result;
                if (typeof result !== "string") {
                  reject(new Error("Unable to encode generated PDF."));
                  return;
                }
                const comma = result.indexOf(",");
                resolve(comma >= 0 ? result.slice(comma + 1) : result);
              };
              reader.readAsDataURL(blob);
            });
          }'''.replace('          ', '')

          if 'reader.readAsDataURL(blob)' not in s:
              s, count = re.subn(
                  r'async function blobToBase64\(blob: Blob\): Promise<string> \{.*?\n\}',
                  new_base64,
                  s,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit('Could not replace blobToBase64')

          new_native = '''  if (Capacitor.isNativePlatform()) {
            if (!blob.size) throw new Error("The generated PDF is empty.");

            // Keep one native copy only to reduce Android bridge/base64 memory pressure.
            const data = await blobToBase64(blob);
            const shareable = await Filesystem.writeFile({
              path: `sunchaser-${Date.now()}-${filename}`,
              data,
              directory: Directory.Cache,
              recursive: true,
            });

            const canShare = await Share.canShare().catch(() => ({ value: false }));
            if (!canShare.value) {
              throw new Error("PDF generated successfully, but Android sharing is unavailable on this device.");
            }

            try {
              // One local PDF should use the single-file `url` path on Android.
              await Share.share({
                title: filename,
                url: shareable.uri,
                dialogTitle: "Save or share quotation PDF",
              });
            } catch (error) {
              console.error("Android PDF share failed", error);
              throw new Error("PDF generated successfully, but Android could not open the Save/Share sheet. Please try again.");
            }
            return;
          }'''.replace('          ', '')

          if 'One local PDF should use the single-file `url` path on Android.' not in s:
              start = s.index('  if (Capacitor.isNativePlatform()) {')
              end_marker = '\n\n  const objectUrl = URL.createObjectURL(blob);'
              end = s.index(end_marker, start)
              s = s[:start] + new_native + s[end:]

          p.write_text(s)

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text()
          g = re.sub(r'versionCode\s+\d+', 'versionCode 12', g, count=1)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.9"', g, count=1)
          gradle.write_text(g)

      - name: Commit hotfix source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Hotfix already applied"
          else
            git config user.name "Sunchaser CI"
            git config user.email "actions@users.noreply.github.com"
            git add src/lib/quotePdfExport.ts android/app/build.gradle
            git commit -m "fix: prevent Android PDF share crash"
            git push origin HEAD:fix/android-pdf-share-crash
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Build CRM frontend
        run: npx vite build --mode production

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify version and APK
        shell: bash
        run: |
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.9-build12-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
