name: Build Android APK

on:
  push:
    branches:
      - feature/mobile-ai-quote-builder-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install JavaScript dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Build latest CRM frontend
        run: npx vite build --mode production

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set APK version 1.0.8 build 11
        shell: bash
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 11/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.0.8"/' android/app/build.gradle
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle

      - name: Show Gradle environment
        working-directory: android
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build debug and release APKs
        id: gradle_build
        continue-on-error: true
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-build-log
          path: gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify APKs exist
        if: steps.gradle_build.outcome == 'success'
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK artifact
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.8-build11-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK artifact
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.8-build11-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Fail job if Gradle failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1
