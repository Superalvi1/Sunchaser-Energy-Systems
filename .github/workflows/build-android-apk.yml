name: Build Android CRM (debug and signed Play bundle)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK 36
        shell: bash
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build CRM frontend
        run: npx vite build --mode production

      - name: Sync native Android assets
        run: |
          npx cap sync android
          node --input-type=module <<'JS'
          import { rmSync, lstatSync } from 'node:fs';
          import { resolve } from 'node:path';
          const uploads = resolve('android/app/src/main/assets/public/uploads');
          try {
            if (lstatSync(uploads).isSymbolicLink()) throw new Error('Refusing linked upload assets');
            rmSync(uploads, { recursive: true });
          } catch (e) { if (e.code !== 'ENOENT') throw e; }
          JS

      - name: Verify release identity and target SDK
        shell: bash
        run: |
          grep -q 'applicationId "com.sunchaser.crm"' android/app/build.gradle
          grep -q 'versionCode 21' android/app/build.gradle
          grep -q 'versionName "1.0.18"' android/app/build.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          chmod +x android/gradlew

      - name: Build debug APK for testing
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.18-build21-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Play upload keystore if configured
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SUN_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SUN_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SUN_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed Play bundle skipped: configure the three SUN_ANDROID_* signing secrets. Do not generate a new upload key unless registered with Play."
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then exit 1; fi
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/sunchaser-release-key.jks
          chmod 600 android/app/sunchaser-release-key.jks
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Google Play AAB
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        env:
          SUN_ANDROID_STORE_PASSWORD: ${{ secrets.SUN_ANDROID_STORE_PASSWORD }}
          SUN_ANDROID_KEY_PASSWORD: ${{ secrets.SUN_ANDROID_KEY_PASSWORD }}
          SUN_ANDROID_KEY_ALIAS: ${{ secrets.SUN_ANDROID_KEY_ALIAS }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload signed Play AAB
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.18-build21-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f android/app/sunchaser-release-key.jks
