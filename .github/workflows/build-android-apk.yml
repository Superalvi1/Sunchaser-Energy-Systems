name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Use runner Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_SDK_ROOT"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Build latest CRM frontend
        run: npx vite build --mode production

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Confirm Android release version
        shell: bash
        run: |
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle
          grep -E 'compileSdkVersion|targetSdkVersion' android/variables.gradle

      - name: Show Gradle environment
        working-directory: android
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build debug APK, release APK, and Play Store bundle
        id: gradle_build
        continue-on-error: true
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-build-log
          path: gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify APKs exist
        if: steps.gradle_build.outcome == 'success'
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK artifact
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.14-build17-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK artifact
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.14-build17-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play Store AAB artifact
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.14-build17-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Fail job if Gradle failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1
