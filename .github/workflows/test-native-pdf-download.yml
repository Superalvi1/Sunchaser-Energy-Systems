name: Test Native PDF Download

on:
  push:
    branches:
      - fix/android-native-pdf-download

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/android-native-pdf-download

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install native PDF plugins
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install @capacitor/file-transfer@^8 @capacitor/file-viewer@^8 --save --ignore-scripts

      - name: Apply native PDF transfer patch
        run: python .github/scripts/native_pdf_patch.py

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Implementation already committed"
          else
            git config user.name "Sunchaser CI"
            git config user.email "actions@users.noreply.github.com"
            git add package.json package-lock.json src/lib/quotePdfExport.ts src/lib/quickQuotationMode.test.ts server.ts android/app/build.gradle
            git commit -m "fix: stream Android quotation PDFs natively"
            git push origin HEAD:fix/android-native-pdf-download
          fi

      - name: Run Quick Quotation regression tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx tsx src/lib/quickQuotationMode.test.ts

      - name: Build CRM frontend
        run: npx vite build --mode production

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK and version
        shell: bash
        run: |
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.10-build13-native-pdf
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
