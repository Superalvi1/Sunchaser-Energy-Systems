name: Build No-Native PDF APK

on:
  push:
    branches:
      - fix/android-pdf-no-native-handoff

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/android-pdf-no-native-handoff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without postinstall
        run: npm ci --ignore-scripts

      - name: Remove Capacitor Browser plugin
        run: npm uninstall @capacitor/browser --save --ignore-scripts || true

      - name: Apply no-native PDF handoff patch
        run: python .github/scripts/no_native_pdf_patch.py

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "Implementation already committed"
          else
            git config user.name "Sunchaser CI"
            git config user.email "actions@users.noreply.github.com"
            git add package.json package-lock.json src/lib/quotePdfExport.ts src/lib/quickQuotationMode.test.ts android/app/build.gradle
            git commit -m "fix: remove native Android PDF handoff"
            git push origin HEAD:fix/android-pdf-no-native-handoff
          fi

      - name: Run Quick Quotation regression tests
        run: npx tsx src/lib/quickQuotationMode.test.ts
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Build CRM frontend
        run: npx vite build --mode production

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK and version
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          grep -q 'versionCode 15' android/app/build.gradle
          grep -q 'versionName "1.0.12"' android/app/build.gradle
          ! grep -q '@capacitor/browser' package.json
          ! grep -q 'Browser.open' src/lib/quotePdfExport.ts
          grep -q 'window.location.assign' src/lib/quotePdfExport.ts

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.12-build15-no-native-pdf
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
