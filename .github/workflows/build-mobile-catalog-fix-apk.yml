name: Build Mobile Catalog Fix APK

on:
  push:
    branches:
      - fix/mobile-catalog-product-selection-crash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-catalog-product-selection-crash

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Catalog selection regression
        run: npx tsx src/lib/quoteProjectScope/catalogSpecs.runtime.test.ts

      - name: Quick quotation/PDF regression
        run: npx tsx src/lib/quickQuotationMode.test.ts
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Build CRM frontend
        run: npx vite build --mode production

      - name: Set Android version 1.0.13 build 16
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('versionCode 15', 'versionCode 16')
          s = s.replace('versionName "1.0.12"', 'versionName "1.0.13"')
          p.write_text(s)
          PY

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify preserved PDF DownloadManager path
        run: |
          grep -q 'DownloadManager' android/app/src/main/java/com/sunchaser/crm/MainActivity.java
          grep -q 'window.location.assign' src/lib/quotePdfExport.ts
          ! grep -q 'Browser.open' src/lib/quotePdfExport.ts

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK and version
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          grep -q 'versionCode 16' android/app/build.gradle
          grep -q 'versionName "1.0.13"' android/app/build.gradle

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.13-build16-catalog-fix
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
