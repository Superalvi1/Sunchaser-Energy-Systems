name: Moos WhatsApp AI staging verification

on:
  pull_request:
    paths:
      - "server/moos/**"
      - "server/whatsappAgent/**"
      - "server/whatsappTransport/**"
      - "scripts/moos-relay-outbox-schema.sql"
      - ".github/workflows/moos-staging-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm-no-send-tests:
    name: CRM Moos security and integration tests (no Meta sends)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MOOS_ENABLED: "false"
      MOOS_RELAY_ENABLED: "false"
      WHATSAPP_AI_AUTO_REPLY_ENABLED: "false"
      WHATSAPP_CONVERSATIONS_ENABLED: "false"
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate CRM Moos HTTP security tests
        run: npx tsx server/moos/moosRouter.integration.test.ts
      - name: Validate relay signature and mutual exclusion
        run: npx tsx server/moos/moosRelay.test.ts
      - name: Validate outbox retry/dedup and dead lettering
        run: npx tsx server/moos/moosRelayOutbox.test.ts
      - name: Validate actual Graph API document payload serialization with fake HTTP
        run: npx tsx server/whatsappTransport/whatsappGraphClient.test.ts
      - name: Validate existing WhatsApp webhook and repository tests
        run: |
          npx tsx server/whatsappTransport/whatsappWebhook.test.ts
          npx tsx server/whatsappTransport/whatsappRepository.test.ts
      - name: Check migration has privacy controls
        run: |
          grep -q 'enable row level security' scripts/moos-relay-outbox-schema.sql
          grep -q 'revoke all' scripts/moos-relay-outbox-schema.sql
          grep -q 'moos_relay_outbox' scripts/moos-relay-outbox-schema.sql

  production-switch-audit:
    name: Static no-send release audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check documented opt-in gates
        run: |
          grep -q 'MOOS_ENABLED' server/moos/moosRouter.ts
          grep -q 'MOOS_RELAY_ENABLED' server/moos/moosRelay.ts
          grep -q 'isLegacyAiEnabledFresh' server/moos/moosRouter.ts
          if grep -R -E 'MOOS_ENABLED=(true|1)' -- .env.production 2>/dev/null; then
            echo 'Unsafe production Moos default'; exit 1
          fi
