name: Validate Catalog Crash Fix

on:
  push:
    branches:
      - fix/catalog-product-selection-crash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Catalog runtime regression
        run: npx tsx src/lib/quoteProjectScope/catalogSpecs.runtime.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Frontend production build
        run: npx vite build
