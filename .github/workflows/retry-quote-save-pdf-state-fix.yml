name: Retry quote save and PDF state hotfix

on:
  push:
    branches:
      - fix/quote-save-pdf-state
    paths:
      - .github/workflows/retry-quote-save-pdf-state-fix.yml

permissions:
  contents: write

jobs:
  apply-test-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/quote-save-pdf-state
          fetch-depth: 0

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Capture existing TypeScript baseline
        shell: bash
        run: |
          npx tsc --noEmit > /tmp/tsc-baseline.txt 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          def normalize(text: str):
              rows = []
              for line in text.splitlines():
                  if 'error TS' not in line:
                      continue
                  line = re.sub(r'\(\d+,\d+\)', '(LINE,COL)', line)
                  rows.append(line.strip())
              return sorted(set(rows))
          Path('/tmp/tsc-baseline-normalized.txt').write_text('\n'.join(normalize(Path('/tmp/tsc-baseline.txt').read_text())) + '\n')
          PY

      - name: Apply hotfix source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-quote-save-pdf-state-fix.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "          PY\n\n      - name: Install dependencies"
          if start not in workflow or end not in workflow:
              raise SystemExit('Could not extract hotfix patch script')
          body = workflow.split(start, 1)[1].split(end, 1)[0]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_quote_hotfix.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/apply_quote_hotfix.py

          # Tighten the regression assertion to reject the old executable lookup,
          # without matching the explanatory comment in the fixed route.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/quotePdfExport.test.ts')
          s = p.read_text()
          old = '  assert.doesNotMatch(staged, /activeState\\.quotes/);'
          new = '  assert.doesNotMatch(staged, /const quotes = \\(activeState\\.quotes/);'
          if old not in s:
              raise SystemExit('Expected staged-export regression assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Run quotation regression tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          npm run test:quote-pdf-export
          npm run test:quote-customer-boq
          npm run test:quote-commercial

      - name: Ensure hotfix adds no TypeScript diagnostics
        shell: bash
        run: |
          npx tsc --noEmit > /tmp/tsc-after.txt 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import re
          def normalize(text: str):
              rows = []
              for line in text.splitlines():
                  if 'error TS' not in line:
                      continue
                  line = re.sub(r'\(\d+,\d+\)', '(LINE,COL)', line)
                  rows.append(line.strip())
              return sorted(set(rows))
          baseline = Path('/tmp/tsc-baseline-normalized.txt').read_text().splitlines()
          after = normalize(Path('/tmp/tsc-after.txt').read_text())
          if baseline != after:
              print('Hotfix changed TypeScript diagnostics:')
              print('\n'.join(difflib.unified_diff(baseline, after, fromfile='baseline', tofile='after', lineterm='')))
              raise SystemExit(1)
          print(f'No new TypeScript diagnostics; baseline remains {len(after)} known error(s).')
          PY

      - name: Build production frontend
        run: npx vite build --mode production

      - name: Commit verified source fix
        shell: bash
        run: |
          git diff --check
          git config user.name 'Sunchaser CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-quote-save-pdf-state-fix.yml .github/workflows/retry-quote-save-pdf-state-fix.yml
          git add server.ts src/components/SalesTeamApp.tsx src/lib/quotePdfExport.ts src/lib/quotePdfExport.test.ts
          git commit -m 'fix: stabilize quote save and PDF actions'
          git push origin HEAD:fix/quote-save-pdf-state
