name: Build Browser PDF APK

on:
  push:
    branches:
      - fix/android-pdf-browser-download

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/android-pdf-browser-download

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Browser plugin
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install @capacitor/browser@8.0.4 --save --ignore-scripts

      - name: Apply browser PDF handoff patch
        run: python .github/scripts/browser_pdf_patch.py

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "Implementation already committed"
          else
            git config user.name "Sunchaser CI"
            git config user.email "actions@users.noreply.github.com"
            git add package.json package-lock.json src/lib/quotePdfExport.ts src/lib/quickQuotationMode.test.ts server.ts android/app/build.gradle
            git commit -m "fix: hand Android quotation PDFs to external browser"
            git push origin HEAD:fix/android-pdf-browser-download
          fi

      - name: Run Quick Quotation regression tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx tsx src/lib/quickQuotationMode.test.ts

      - name: Build CRM frontend
        run: npx vite build --mode production

      - name: Install JetBrains Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK and version
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          grep -q 'versionCode 14' android/app/build.gradle
          grep -q 'versionName "1.0.11"' android/app/build.gradle

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sunchaser-CRM-1.0.11-build14-browser-pdf
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
