name: Fix Quick PDF Stage

on:
  push:
    branches:
      - fix/android-pdf-browser-download

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-pdf-browser-download
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: Apply correction
        run: python .github/scripts/fix_quick_stage.py
      - name: Run regression test
        run: npx tsx src/lib/quickQuotationMode.test.ts
      - name: Build frontend
        run: npx vite build --mode production
      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "No source changes"
          else
            git config user.name "Sunchaser CI"
            git config user.email "actions@users.noreply.github.com"
            git add server.ts src/lib/quickQuotationMode.test.ts
            git commit -m "fix: stage Quick Quotation PDF for Android browser handoff"
            git push origin HEAD:fix/android-pdf-browser-download
          fi
